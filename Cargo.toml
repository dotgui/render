[workspace]
members = [
  "crates/renderer",
  "crates/renderer-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
fontdue = "0.9"
resvg = "0.47"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taffy = "0.13"
thiserror = "1"
tiny-skia = { version = "0.12", features = ["png-format"] }
ttf-parser = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasm-bindgen = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
